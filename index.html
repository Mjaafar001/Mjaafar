<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MJ Football Academy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%2313804f%22/><rect x=%225%22 y=%227%22 width=%2222%22 height=%2218%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/><path d=%22M16 7v18%22 stroke=%22white%22 stroke-width=%222%22/><circle cx=%2216%22 cy=%2216%22 r=%223.5%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/></svg>">
  <!-- build:head -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <!-- /build:head -->
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img id="brand-logo" class="logo-img" alt="" hidden>
      <svg id="default-logo" class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><rect x="5" y="7" width="22" height="18" fill="none" stroke="var(--on-accent)" stroke-width="2"/><path d="M16 7v18" stroke="var(--on-accent)" stroke-width="2"/><circle cx="16" cy="16" r="3.5" fill="none" stroke="var(--on-accent)" stroke-width="2"/></svg>
      <span id="academy-name">MJ Football Academy</span>
      <span id="who" class="who" hidden></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#dashboard" data-route="dashboard">Dashboard</a>
      <a href="#players" data-route="players">Players</a>
      <a href="#attendance" data-route="attendance">Attendance</a>
      <a href="#payments" data-route="payments">Fees</a>
      <a href="#expenses" data-route="expenses">Expenses</a>
      <a href="#reports" data-route="reports">Reports</a>
      <a href="#settings" data-route="settings">Settings</a>
    </nav>
  </header>

  <main id="view" class="container"></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form"></form>
  </dialog>

  <dialog id="confirm" class="confirm">
    <p id="confirm-msg"></p>
    <div class="modal-actions">
      <button type="button" id="confirm-cancel">Cancel</button>
      <button type="button" id="confirm-ok" class="primary">OK</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
